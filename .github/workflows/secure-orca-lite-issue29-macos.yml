name: Secure Orca Lite Issue 29 macOS Acceptance Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci-issue29-packaged-acceptance-4def2a45

permissions:
  contents: read

concurrency:
  group: secure-orca-lite-issue29-macos-${{ github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_PRODUCT_BRANCH: company-work
  EXPECTED_SOURCE_SHA: 4def2a450e9dd45d5e49b89b96561b18a889ecb3
  ARTIFACT_NAME: secure-orca-lite-macos-4def2a45
  NODE_OPTIONS: --max-old-space-size=4096
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  macos:
    if: github.repository == 'Guan21/cc-orca' && github.ref_name == 'ci-issue29-packaged-acceptance-4def2a45'
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact product source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${EXPECTED_PRODUCT_BRANCH}:refs/remotes/origin/${EXPECTED_PRODUCT_BRANCH}"
          branch_sha="$(git rev-parse "origin/${EXPECTED_PRODUCT_BRANCH}")"
          head_sha="$(git rev-parse HEAD)"
          echo "origin/${EXPECTED_PRODUCT_BRANCH}: ${branch_sha}"
          echo "HEAD: ${head_sha}"
          echo "EXPECTED_SOURCE_SHA: ${EXPECTED_SOURCE_SHA}"
          if [[ "${branch_sha}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "::error::Product branch mismatch: expected ${EXPECTED_SOURCE_SHA}, got ${branch_sha}"
            exit 1
          fi
          if [[ "${head_sha}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "::error::Product checkout mismatch: expected ${EXPECTED_SOURCE_SHA}, got ${head_sha}"
            exit 1
          fi
          {
            echo "PRODUCT_BRANCH=${EXPECTED_PRODUCT_BRANCH}"
            echo "PRODUCT_SHA=${head_sha}"
          } >>"${GITHUB_ENV}"

      - name: Record macOS build host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          {
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            sw_vers
            echo "uname=$(uname -a)"
          } | tee build-evidence/macos-build-host.txt

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare pnpm 12.0.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.0.0 --activate
          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          echo "Node: ${node_version}"
          echo "pnpm: ${pnpm_version}"
          if [[ "${node_version}" != v24.* ]]; then
            echo "::error::Expected Node 24, got ${node_version}"
            exit 1
          fi
          if [[ "${pnpm_version}" != 12.0.0 ]]; then
            echo "::error::Expected pnpm 12.0.0, got ${pnpm_version}"
            exit 1
          fi
          {
            echo "node=${node_version}"
            echo "pnpm=${pnpm_version}"
          } | tee build-evidence/toolchain.txt

      - name: Install dependencies with frozen lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile unchanged
        shell: bash
        run: git diff --exit-code -- pnpm-lock.yaml package.json

      - name: Build corporate macOS installers
        shell: bash
        run: pnpm run build:mac:corporate

      - name: Collect installer evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts build-evidence
          x64_dmg="$(find dist -type f -name 'secure-orca-lite-macos-x64.dmg' | sort | head -n 1)"
          arm64_dmg="$(find dist -type f -name 'secure-orca-lite-macos-arm64.dmg' | sort | head -n 1)"
          if [[ -z "${x64_dmg}" || ! -f "${x64_dmg}" ]]; then
            echo "::error::Missing secure-orca-lite-macos-x64.dmg"
            exit 1
          fi
          if [[ -z "${arm64_dmg}" || ! -f "${arm64_dmg}" ]]; then
            echo "::error::Missing secure-orca-lite-macos-arm64.dmg"
            exit 1
          fi
          cp "${x64_dmg}" build-artifacts/
          cp "${arm64_dmg}" build-artifacts/
          find dist -maxdepth 1 -type f -name '*.zip' -print0 | xargs -0 -I {} cp {} build-artifacts/ || true

          x64_size="$(stat -f%z "${x64_dmg}")"
          arm64_size="$(stat -f%z "${arm64_dmg}")"
          x64_sha="$(shasum -a 256 "${x64_dmg}" | awk '{print $1}')"
          arm64_sha="$(shasum -a 256 "${arm64_dmg}" | awk '{print $1}')"

          {
            echo "source_branch=${PRODUCT_BRANCH}"
            echo "source_sha=${PRODUCT_SHA}"
            echo "x64_name=$(basename "${x64_dmg}")"
            echo "x64_path=${x64_dmg}"
            echo "x64_size=${x64_size}"
            echo "x64_sha256=${x64_sha}"
            echo "arm64_name=$(basename "${arm64_dmg}")"
            echo "arm64_path=${arm64_dmg}"
            echo "arm64_size=${arm64_size}"
            echo "arm64_sha256=${arm64_sha}"
          } | tee build-evidence/installers.env

          {
            echo "x64_name=$(basename "${x64_dmg}")"
            echo "x64_path=${x64_dmg}"
            echo "x64_size=${x64_size}"
            echo "x64_sha256=${x64_sha}"
            echo "arm64_name=$(basename "${arm64_dmg}")"
            echo "arm64_path=${arm64_dmg}"
            echo "arm64_size=${arm64_size}"
            echo "arm64_sha256=${arm64_sha}"
          } >>"${GITHUB_OUTPUT}"

      - name: Structural acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence/structural

          check_dmg() {
            local arch="$1"
            local dmg="$2"
            local mount_point
            mount_point="$(mktemp -d)"
            echo "Checking ${arch}: ${dmg}"
            hdiutil attach -readonly -nobrowse -mountpoint "${mount_point}" "${dmg}" >/tmp/hdiutil-${arch}.log
            trap 'hdiutil detach "${mount_point}" -quiet || true; rm -rf "${mount_point}"' RETURN

            local app_path="${mount_point}/Secure Orca Lite.app"
            if [[ ! -d "${app_path}" ]]; then
              echo "::error::Missing Secure Orca Lite.app in ${dmg}"
              exit 1
            fi

            local plist="${app_path}/Contents/Info.plist"
            local resources="${app_path}/Contents/Resources"
            local macos="${app_path}/Contents/MacOS"
            local evidence="build-evidence/structural/${arch}.txt"
            local display_name bundle_name executable bundle_id icon_file profile

            display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${plist}")"
            bundle_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "${plist}")"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${plist}")"
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")"
            icon_file="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "${plist}")"

            [[ "${display_name}" == "Secure Orca Lite" ]]
            [[ "${bundle_name}" == "Secure Orca Lite" ]]
            [[ "${executable}" == "Secure Orca Lite" ]]
            [[ "${bundle_id}" == "dev.orca.secure-lite" ]]
            [[ -x "${macos}/Secure Orca Lite" ]]
            [[ -f "${resources}/${icon_file}" || -f "${resources}/${icon_file}.icns" ]]
            [[ -f "${resources}/tray/corporate-menu-barTemplate.png" ]]
            [[ -f "${resources}/tray/corporate-menu-barTemplate@2x.png" ]]
            grep -q 'Secure Orca Lite' "${plist}"

            profile="$(node -e "const fs=require('fs'); const p='${resources}/app.asar.unpacked/out/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(j.orcaBuildProfile || '')")"
            [[ "${profile}" == "corporate" ]]

            {
              echo "arch=${arch}"
              echo "app_path=${app_path}"
              echo "CFBundleDisplayName=${display_name}"
              echo "CFBundleName=${bundle_name}"
              echo "CFBundleExecutable=${executable}"
              echo "CFBundleIdentifier=${bundle_id}"
              echo "CFBundleIconFile=${icon_file}"
              echo "executable_present=YES"
              echo "icon_present=YES"
              echo "corporate_tray_assets=YES"
              echo "tcc_identity_contains_secure_orca_lite=YES"
              echo "corporate_profile_marker=${profile}"
            } | tee "${evidence}"

            hdiutil detach "${mount_point}" -quiet
            rm -rf "${mount_point}"
            trap - RETURN
          }

          check_dmg x64 "${{ steps.evidence.outputs.x64_path }}"
          check_dmg arm64 "${{ steps.evidence.outputs.arm64_path }}"

      - name: Upload macOS installer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build-artifacts/*
            build-evidence/*

      - name: Summarize build
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Secure Orca Lite Issue 29 macOS Installer Build"
            echo
            echo "- product branch: ${PRODUCT_BRANCH}"
            echo "- exact product SHA: ${PRODUCT_SHA}"
            echo "- source isolation: PASS"
            echo "- command: pnpm run build:mac:corporate"
            echo "- x64 DMG: ${{ steps.evidence.outputs.x64_name }}"
            echo "- x64 size: ${{ steps.evidence.outputs.x64_size }}"
            echo "- x64 SHA256: ${{ steps.evidence.outputs.x64_sha256 }}"
            echo "- arm64 DMG: ${{ steps.evidence.outputs.arm64_name }}"
            echo "- arm64 size: ${{ steps.evidence.outputs.arm64_size }}"
            echo "- arm64 SHA256: ${{ steps.evidence.outputs.arm64_sha256 }}"
            echo "- structural acceptance: PASS"
            echo "- artifact name: ${ARTIFACT_NAME}"
            echo "- artifact ID: ${{ steps.upload.outputs.artifact-id }}"
            echo "- artifact URL: ${{ steps.upload.outputs.artifact-url }}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
